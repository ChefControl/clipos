# cargo-deny (`cargo deny check`): known vulnerabilities, licences and where crates come
# from. Run in CI on Rust changes (phase 7's security pass, done in S1 of the redesign).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it's listed here with a reason.
ignore = []

[licenses]
# Permissive licences only; clipos is private, but keep it clean.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crates (publish = false) carry no licence.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
