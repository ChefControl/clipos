# The dashboards are files in the image; edits made in the UI can't be saved over them.
# To change one, edit it in the UI, export the JSON (Share > Export) and replace the file.
apiVersion: 1
providers:
  - name: clipos
    folder: clipos
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
