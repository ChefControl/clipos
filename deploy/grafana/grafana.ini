# clipos Grafana. infra/azure/grafana.tf sets the rest as GF_* app settings: root_url,
# the Auth0 client and URLs, and role_attribute_path (only ADMIN_EMAILS get in).

[server]
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[security]
# No built-in admin account: the only way in is Auth0.
disable_initial_admin_creation = true
cookie_secure = true
cookie_samesite = lax
strict_transport_security = true
content_security_policy = true
disable_gravatar = true

[snapshots]
enabled = false

[public_dashboards]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

# Auth0 (the clipos tenant's Google login). The post-login Action only lets verified
# Google accounts through; role_attribute_strict turns away everyone whose email isn't in
# role_attribute_path (an app setting built from ADMIN_EMAILS).
[auth.generic_oauth]
name = Google
icon = signin
scopes = openid email profile
email_attribute_path = email
login_attribute_path = email
name_attribute_path = name
use_pkce = true
# clipos-grafana authenticates with client_secret_post (infra/auth0).
auth_style = InParams
allow_sign_up = true
auto_login = true
role_attribute_strict = true
allow_assign_grafana_admin = false

[azure]
managed_identity_enabled = true

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/overview.json

[log]
mode = console
level = warn
